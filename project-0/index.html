<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Project 0: Becoming Friends with Your Camera for CS180."
    />
    <title>Project 0 — Becoming Friends with Your Camera</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="project-page">
      <nav class="project-nav">
        <a href="../">← Back</a>
      </nav>

      <header class="project-hero project-hero-compact">
        <p class="label">CS180 / Project 0</p>
        <h1>Becoming Friends<br />with Your Camera</h1>
        <p>
          Learning how to take cooler photos (of my roommates and snoopy!)
        </p>
      </header>

      <!-- The project parts are vertical sections, one after another. -->
      <div class="project-parts project-parts-simple">
        <section class="project-part">
          <div class="part-heading">
            <div>
              <p class="label">Part 1</p>
              <h2>Selfie: The Wrong Way vs. The Right Way</h2>
            </div>
          </div>

          <div class="photo-row" aria-label="Four photos for part one">
            <figure>
              <img src="../static/IMG_1557.jpg" alt="Selfie comparison photo 1" />
            </figure>
            <figure>
              <img src="../static/IMG_1558.jpg" alt="Selfie comparison photo 2" />
            </figure>
            <figure>
              <img src="../static/IMG_1560.jpg" alt="Selfie comparison photo 3" />
            </figure>
          </div>
        </section>

        <section class="project-part">
          <div class="part-heading">
            <div>
              <p class="label">Part 2</p>
              <h2>Architectural Perspective Compression</h2>
            </div>
          </div>

          <div class="photo-row two-photos" aria-label="Two architectural perspective photos">
            <figure>
              <img src="../static/IMG_1705.jpg" alt="Architectural perspective photo 1" />
            </figure>
            <figure>
              <img src="../static/IMG_1707.jpg" alt="Architectural perspective photo 2" />
            </figure>
          </div>
        </section>

        <section class="project-part">
          <div class="part-heading">
            <div>
              <p class="label">Part 3</p>
              <h2>Dolly Zoom</h2>
            </div>
          </div>

          <div class="photo-row gif-row single-gif" aria-label="Dolly zoom animation">
            <figure>
              <img src="../static/animation_edited.gif?v=685212a9" alt="Dolly zoom animation" />
              <figcaption>Fast</figcaption>
            </figure>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
